<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" role="img" aria-label="Orion Architecture Diagram">
  <defs>
    <radialGradient id="archBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e1524"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d131f" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>

    <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#818cf8"/>
    </marker>

    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="640" fill="url(#archBg)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="60" y1="0" x2="60" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="640"/>
    <line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="870" y1="0" x2="870" y2="640"/>
    <line x1="1140" y1="0" x2="1140" y2="640"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#38bdf8"/>
    <text x="24" y="12" fill="#ffffff" class="sans" font-size="16" font-weight="700" letter-spacing="0.1em">ORION SYSTEM ARCHITECTURE</text>
    <text x="340" y="12" fill="#64748b" class="mono" font-size="12">RUNTIME PIPELINE // ZERO-CLOUD EXECUTION</text>

    <!-- Status Tag -->
    <rect x="915" y="-5" width="165" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="928" cy="7" r="3" fill="#10b981"/>
    <text x="938" y="11" fill="#94a3b8" class="mono" font-size="10" font-weight="600">CLIENT-SANDBOX ONLY</text>
  </g>

  <!-- Privacy Boundary Outline -->
  <rect x="50" y="85" width="1100" height="470" rx="18" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="70" y="74" width="220" height="22" rx="4" fill="#080c14"/>
  <text x="78" y="89" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600" letter-spacing="0.08em">🔒 DEVICE LOCAL PERIMETER</text>

  <!-- ==================== COLUMN 1: CLIENT APPLICATION ==================== -->
  <g transform="translate(80, 120)">
    <rect width="230" height="400" rx="14" fill="url(#cardBg)" stroke="url(#glowBorder)" stroke-width="1" filter="url(#softShadow)"/>
    
    <!-- Column Title -->
    <rect x="16" y="16" width="198" height="26" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <text x="26" y="33" fill="#38bdf8" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em">CLIENT APPLICATION</text>
    
    <!-- Item 1: Next.js 15 App Shell -->
    <g transform="translate(16, 58)">
      <rect width="198" height="66" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">Next.js 15 UI</text>
      <text x="14" y="42" fill="#64748b" class="sans" font-size="11">App Router &amp; React 19</text>
      <text x="14" y="55" fill="#38bdf8" class="mono" font-size="9.5">Streaming Chat Views</text>
    </g>

    <!-- Item 2: Document Interface -->
    <g transform="translate(16, 136)">
      <rect width="198" height="66" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">Document Engine</text>
      <text x="14" y="42" fill="#64748b" class="sans" font-size="11">PDF, DOCX, CSV Ingestion</text>
      <text x="14" y="55" fill="#38bdf8" class="mono" font-size="9.5">Local Chunking &amp; OCR</text>
    </g>

    <!-- Item 3: PWA & State -->
    <g transform="translate(16, 214)">
      <rect width="198" height="66" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">PWA Shell</text>
      <text x="14" y="42" fill="#64748b" class="sans" font-size="11">Installable Web App</text>
      <text x="14" y="55" fill="#10b981" class="mono" font-size="9.5">Offline-Ready Caching</text>
    </g>

    <!-- Item 4: Zustand Store -->
    <g transform="translate(16, 292)">
      <rect width="198" height="88" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">Reactive Store</text>
      <text x="14" y="42" fill="#64748b" class="sans" font-size="11">Zustand State Manager</text>
      <text x="14" y="58" fill="#64748b" class="sans" font-size="11">Model Registry &amp; Download</text>
      <text x="14" y="74" fill="#38bdf8" class="mono" font-size="9.5">Realtime Token Pipeline</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: WORKER ISOLATION LAYER ==================== -->
  <g transform="translate(355, 120)">
    <rect width="230" height="400" rx="14" fill="url(#cardBg)" stroke="url(#glowBorder)" stroke-width="1" filter="url(#softShadow)"/>
    
    <rect x="16" y="16" width="198" height="26" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <text x="26" y="33" fill="#818cf8" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em">WORKER ISOLATION</text>

    <!-- Item 1: Dedicated LLM Worker -->
    <g transform="translate(16, 58)">
      <rect width="198" height="150" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <rect x="10" y="10" width="8" height="8" rx="2" fill="#818cf8"/>
      <text x="24" y="19" fill="#f8fafc" class="sans" font-size="13" font-weight="600">LLM Web Worker</text>
      <text x="14" y="42" fill="#818cf8" class="mono" font-size="10">workers/llm.worker.ts</text>
      <text x="14" y="66" fill="#94a3b8" class="sans" font-size="11">Off-main-thread compute</text>
      <text x="14" y="86" fill="#64748b" class="sans" font-size="10.5">Prevents UI thread freezing</text>
      <text x="14" y="106" fill="#64748b" class="sans" font-size="10.5">Async RPC message bridge</text>
      <rect x="14" y="120" width="170" height="18" rx="4" fill="#1e1b4b"/>
      <text x="20" y="133" fill="#c084fc" class="mono" font-size="9.5">Zero UI Frame Drops (60fps)</text>
    </g>

    <!-- Item 2: Document Worker -->
    <g transform="translate(16, 230)">
      <rect width="198" height="150" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <rect x="10" y="10" width="8" height="8" rx="2" fill="#818cf8"/>
      <text x="24" y="19" fill="#f8fafc" class="sans" font-size="13" font-weight="600">Document Worker</text>
      <text x="14" y="42" fill="#818cf8" class="mono" font-size="10">workers/document.worker.ts</text>
      <text x="14" y="66" fill="#94a3b8" class="sans" font-size="11">Heavy text extraction</text>
      <text x="14" y="86" fill="#64748b" class="sans" font-size="10.5">PDF / DOCX chunking</text>
      <text x="14" y="106" fill="#64748b" class="sans" font-size="10.5">Tesseract OCR processing</text>
      <rect x="14" y="120" width="170" height="18" rx="4" fill="#1e1b4b"/>
      <text x="20" y="133" fill="#c084fc" class="mono" font-size="9.5">Local Context Pipeline</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: INFERENCE RUNTIME ==================== -->
  <g transform="translate(630, 120)">
    <rect width="230" height="400" rx="14" fill="url(#cardBg)" stroke="url(#glowBorder)" stroke-width="1" filter="url(#softShadow)"/>
    
    <rect x="16" y="16" width="198" height="26" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <text x="26" y="33" fill="#38bdf8" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em">INFERENCE RUNTIME</text>

    <!-- WebLLM Engine -->
    <g transform="translate(16, 58)">
      <rect width="198" height="150" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">@mlc-ai/web-llm</text>
      <text x="14" y="44" fill="#38bdf8" class="mono" font-size="10">Compiled WASM + WGSL</text>
      <text x="14" y="68" fill="#94a3b8" class="sans" font-size="11">Quantized model execution</text>
      <text x="14" y="88" fill="#64748b" class="sans" font-size="10.5">Llama-3.2, Qwen-2.5, Phi-3.5</text>
      <text x="14" y="108" fill="#64748b" class="sans" font-size="10.5">KV-Cache &amp; streaming tokens</text>
      <rect x="14" y="120" width="170" height="18" rx="4" fill="#082f49"/>
      <text x="20" y="133" fill="#38bdf8" class="mono" font-size="9.5">Token Generation Engine</text>
    </g>

    <!-- WebGPU Hardware Compute -->
    <g transform="translate(16, 230)">
      <rect width="198" height="150" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">WebGPU Acceleration</text>
      <text x="14" y="44" fill="#34d399" class="mono" font-size="10">Hardware GPU Shaders</text>
      <text x="14" y="68" fill="#94a3b8" class="sans" font-size="11">Direct Metal / Vulkan / D3D12</text>
      <text x="14" y="88" fill="#64748b" class="sans" font-size="10.5">Matrix multiplication kernels</text>
      <text x="14" y="108" fill="#64748b" class="sans" font-size="10.5">30-60+ tok/s native speed</text>
      <rect x="14" y="120" width="170" height="18" rx="4" fill="#064e3b"/>
      <text x="20" y="133" fill="#34d399" class="mono" font-size="9.5">Raw Silicon Acceleration</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: PERSISTENCE & STORAGE ==================== -->
  <g transform="translate(905, 120)">
    <rect width="230" height="400" rx="14" fill="url(#cardBg)" stroke="url(#glowBorder)" stroke-width="1" filter="url(#softShadow)"/>
    
    <rect x="16" y="16" width="198" height="26" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <text x="26" y="33" fill="#34d399" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em">LOCAL PERSISTENCE</text>

    <!-- IndexedDB / Dexie -->
    <g transform="translate(16, 58)">
      <rect width="198" height="150" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">IndexedDB · Dexie.js</text>
      <text x="14" y="44" fill="#34d399" class="mono" font-size="10">lib/db/orion-db.ts</text>
      <text x="14" y="68" fill="#94a3b8" class="sans" font-size="11">Local conversations table</text>
      <text x="14" y="88" fill="#64748b" class="sans" font-size="10.5">Document text &amp; chunk storage</text>
      <text x="14" y="108" fill="#64748b" class="sans" font-size="10.5">User settings &amp; preferences</text>
      <rect x="14" y="120" width="170" height="18" rx="4" fill="#064e3b"/>
      <text x="20" y="133" fill="#34d399" class="mono" font-size="9.5">Never Leaves Device Disk</text>
    </g>

    <!-- Cache API -->
    <g transform="translate(16, 230)">
      <rect width="198" height="150" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="13" font-weight="600">Browser Cache API</text>
      <text x="14" y="44" fill="#34d399" class="mono" font-size="10">Origin-Private Cache</text>
      <text x="14" y="68" fill="#94a3b8" class="sans" font-size="11">Pre-cached model weights</text>
      <text x="14" y="88" fill="#64748b" class="sans" font-size="10.5">WASM binary storage</text>
      <text x="14" y="108" fill="#64748b" class="sans" font-size="10.5">Service worker offline assets</text>
      <rect x="14" y="120" width="170" height="18" rx="4" fill="#064e3b"/>
      <text x="20" y="133" fill="#34d399" class="mono" font-size="9.5">Zero-Network Offline Use</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTOR ARROWS ==================== -->
  <!-- Col 1 to Col 2 -->
  <path d="M 310,210 L 350,210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 310,340 L 350,340" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- Col 2 to Col 3 -->
  <path d="M 585,210 L 625,210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 585,340 L 625,340" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- Col 3 to Col 4 -->
  <path d="M 860,210 L 900,210" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 860,340 L 900,340" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Bottom Privacy Statement -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="1080" height="36" rx="8" fill="#0b111e" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="23" fill="#10b981" class="mono" font-size="11" font-weight="600">ZERO CLOUD GUARANTEE:</text>
    <text x="180" y="23" fill="#94a3b8" class="sans" font-size="11.5">No inference requests leave the browser. Zero telemetry. Zero remote logging. Local weights, local compute, local persistence.</text>
  </g>
</svg>
