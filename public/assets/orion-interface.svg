<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" role="img" aria-label="Orion Application Interface">
  <defs>
    <radialGradient id="uiGlow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </radialGradient>

    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="bubbleAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- App Window Container -->
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="url(#uiGlow)" stroke="url(#windowBorder)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Window Header / Titlebar -->
  <rect x="20" y="20" width="1160" height="44" rx="16" fill="#0c101a"/>
  <!-- Square off bottom corners of titlebar -->
  <rect x="20" y="48" width="1160" height="16" fill="#0c101a"/>
  <line x1="20" y1="64" x2="1180" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- Traffic Light Window Controls -->
  <circle cx="48" cy="42" r="5.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="68" cy="42" r="5.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="88" cy="42" r="5.5" fill="#10b981" opacity="0.85"/>

  <!-- Window Title / Address Badge -->
  <g transform="translate(450, 30)">
    <rect width="300" height="24" rx="6" fill="#151d2d" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="12" r="3.5" fill="#10b981"/>
    <text x="28" y="16" fill="#94a3b8" class="mono" font-size="10.5" font-weight="500">orion.app // local-webgpu-inference</text>
  </g>

  <!-- Right Status Pills -->
  <g transform="translate(1005, 30)">
    <rect width="145" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" fill="#34d399" class="mono" font-size="10" font-weight="600">● OFFLINE READY</text>
  </g>

  <!-- ==================== LEFT SIDEBAR ==================== -->
  <g transform="translate(20, 64)">
    <rect width="240" height="596" fill="#0a0e17"/>
    <line x1="240" y1="0" x2="240" y2="596" stroke="#1e293b" stroke-width="1"/>

    <!-- App Brand -->
    <g transform="translate(24, 24)">
      <!-- Orion Logo Icon -->
      <ellipse cx="14" cy="14" rx="8" ry="11" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="14" cy="14" rx="14" ry="4.5" transform="rotate(-30 14 14)" fill="none" stroke="#818cf8" stroke-width="1"/>
      <circle cx="26" cy="7" r="1.5" fill="#38bdf8"/>
      <circle cx="2" cy="21" r="1.5" fill="#818cf8"/>

      <text x="36" y="17" fill="#f8fafc" class="sans" font-size="15" font-weight="700">Orion</text>
      <text x="36" y="30" fill="#64748b" class="sans" font-size="10">Private On-Device AI</text>
    </g>

    <!-- Navigation List -->
    <g transform="translate(16, 80)">
      <!-- Item: Chat (Active) -->
      <rect width="208" height="38" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="19" r="4" fill="#38bdf8"/>
      <text x="34" y="24" fill="#ffffff" class="sans" font-size="12.5" font-weight="600">Chat</text>
      <rect x="156" y="10" width="40" height="18" rx="4" fill="#082f49"/>
      <text x="163" y="22" fill="#38bdf8" class="mono" font-size="9" font-weight="600">ACTIVE</text>

      <!-- Item: Documents -->
      <g transform="translate(0, 48)">
        <rect width="208" height="36" rx="8" fill="transparent"/>
        <circle cx="20" cy="18" r="4" fill="#64748b"/>
        <text x="34" y="23" fill="#94a3b8" class="sans" font-size="12.5" font-weight="500">Documents</text>
        <text x="180" y="23" fill="#64748b" class="mono" font-size="10">3</text>
      </g>

      <!-- Item: Models -->
      <g transform="translate(0, 92)">
        <rect width="208" height="36" rx="8" fill="transparent"/>
        <circle cx="20" cy="18" r="4" fill="#64748b"/>
        <text x="34" y="23" fill="#94a3b8" class="sans" font-size="12.5" font-weight="500">Models</text>
        <text x="180" y="23" fill="#64748b" class="mono" font-size="10">1</text>
      </g>

      <!-- Item: Settings -->
      <g transform="translate(0, 136)">
        <rect width="208" height="36" rx="8" fill="transparent"/>
        <circle cx="20" cy="18" r="4" fill="#64748b"/>
        <text x="34" y="23" fill="#94a3b8" class="sans" font-size="12.5" font-weight="500">Settings</text>
      </g>

      <!-- Item: Performance -->
      <g transform="translate(0, 180)">
        <rect width="208" height="36" rx="8" fill="transparent"/>
        <circle cx="20" cy="18" r="4" fill="#64748b"/>
        <text x="34" y="23" fill="#94a3b8" class="sans" font-size="12.5" font-weight="500">Performance</text>
      </g>
    </g>

    <!-- Sidebar Bottom System Info Card -->
    <g transform="translate(16, 420)">
      <rect width="208" height="150" rx="10" fill="#0f1624" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" class="sans" font-size="11" font-weight="700" letter-spacing="0.05em">DEVICE HARDWARE</text>
      
      <text x="14" y="50" fill="#64748b" class="sans" font-size="10">Inference Engine</text>
      <text x="14" y="66" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600">WebGPU (Metal/Vulkan)</text>

      <text x="14" y="90" fill="#64748b" class="sans" font-size="10">Active Model</text>
      <text x="14" y="106" fill="#f8fafc" class="mono" font-size="10.5">Llama-3.2-1B-Instruct</text>

      <line x1="14" y1="118" x2="194" y2="118" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="136" fill="#34d399" class="mono" font-size="9.5" font-weight="600">● 100% LOCAL DISK &amp; RAM</text>
    </g>
  </g>

  <!-- ==================== MAIN WORKSPACE AREA ==================== -->
  <g transform="translate(260, 64)">
    
    <!-- Workspace Top Bar -->
    <g transform="translate(30, 20)">
      <text x="0" y="20" fill="#f8fafc" class="sans" font-size="16" font-weight="700">Document Q&amp;A Session</text>
      <text x="0" y="38" fill="#64748b" class="sans" font-size="11.5">Context: architecture-spec.pdf (32 pages · 48 chunks indexed)</text>

      <!-- Top Right Badges -->
      <g transform="translate(620, 6)">
        <rect width="120" height="24" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
        <text x="12" y="16" fill="#38bdf8" class="mono" font-size="9.5" font-weight="600">WEBGPU ACTIVE</text>

        <g transform="translate(130, 0)">
          <rect width="110" height="24" rx="12" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <text x="12" y="16" fill="#4ade80" class="mono" font-size="9.5" font-weight="600">0 KB NETWORK</text>
        </g>
      </g>
    </g>

    <line x1="30" y1="74" x2="890" y2="74" stroke="#1e293b" stroke-width="1"/>

    <!-- ==================== CHAT STREAM ==================== -->
    <g transform="translate(30, 95)">
      
      <!-- User Message -->
      <g transform="translate(180, 0)">
        <rect width="680" height="66" rx="12" fill="url(#bubbleUser)" stroke="#334155" stroke-width="1"/>
        <text x="20" y="26" fill="#94a3b8" class="sans" font-size="10.5" font-weight="600">YOU</text>
        <text x="20" y="48" fill="#f8fafc" class="sans" font-size="13">Can you analyze the uploaded architecture document without sending any data to external servers?</text>
      </g>

      <!-- Assistant Message -->
      <g transform="translate(0, 85)">
        <rect width="860" height="240" rx="14" fill="url(#bubbleAi)" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Assistant Avatar / Badge -->
        <g transform="translate(20, 20)">
          <rect width="28" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
          <ellipse cx="14" cy="14" rx="6" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="2.5" fill="#818cf8"/>
        </g>
        <text x="58" y="32" fill="#f8fafc" class="sans" font-size="13" font-weight="700">Orion Assistant</text>
        <text x="175" y="32" fill="#34d399" class="mono" font-size="10">● On-Device GPU Stream</text>

        <!-- Response Body -->
        <text x="24" y="72" fill="#e2e8f0" class="sans" font-size="13.5" font-weight="400">Yes, completely. Your document was parsed using client-side Web Workers and indexed into</text>
        <text x="24" y="94" fill="#e2e8f0" class="sans" font-size="13.5" font-weight="400">your browser's local IndexedDB table. Model inference is executing directly on your device's</text>
        <text x="24" y="116" fill="#e2e8f0" class="sans" font-size="13.5" font-weight="400">WebGPU shaders via WebLLM compiled kernels.</text>

        <!-- Cited Document Card -->
        <g transform="translate(24, 134)">
          <rect width="460" height="34" rx="6" fill="#131d2e" stroke="#1f2d45" stroke-width="1"/>
          <text x="14" y="21" fill="#38bdf8" class="mono" font-size="10">📄 architecture-spec.pdf · Section 4.1: "Storage and Isolation"</text>
        </g>

        <!-- Realtime Telemetry Strip -->
        <g transform="translate(24, 184)">
          <rect width="812" height="36" rx="8" fill="#080c14" stroke="#1a2333" stroke-width="1"/>
          <text x="18" y="22" fill="#64748b" class="mono" font-size="10.5">GENERATION SPEED:</text>
          <text x="135" y="22" fill="#38bdf8" class="mono" font-size="10.5" font-weight="700">46.8 tok/s</text>

          <text x="230" y="22" fill="#64748b" class="mono" font-size="10.5">LATENCY (TTFT):</text>
          <text x="330" y="22" fill="#f8fafc" class="mono" font-size="10.5" font-weight="600">94ms</text>

          <text x="400" y="22" fill="#64748b" class="mono" font-size="10.5">OUTBOUND NETWORK:</text>
          <text x="535" y="22" fill="#34d399" class="mono" font-size="10.5" font-weight="700">0 BYTES</text>

          <text x="635" y="22" fill="#64748b" class="mono" font-size="10.5">STORAGE:</text>
          <text x="705" y="22" fill="#c084fc" class="mono" font-size="10.5" font-weight="600">IndexedDB</text>
        </g>
      </g>
    </g>

    <!-- ==================== PROMPT INPUT BOX ==================== -->
    <g transform="translate(30, 480)">
      <rect width="860" height="74" rx="14" fill="#0f1624" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Input Placeholder Text -->
      <text x="24" y="34" fill="#64748b" class="sans" font-size="13">Ask follow-up questions, summarize sections, or query local documents...</text>

      <!-- Bottom Toolbar inside input -->
      <g transform="translate(24, 46)">
        <rect width="110" height="20" rx="4" fill="#1e293b"/>
        <text x="8" y="14" fill="#94a3b8" class="sans" font-size="10">📎 1 Document Attached</text>

        <rect x="120" y="0" width="80" height="20" rx="4" fill="#1e293b"/>
        <text x="128" y="14" fill="#38bdf8" class="mono" font-size="10">WebGPU: ON</text>
      </g>

      <!-- Send Button -->
      <g transform="translate(806, 18)">
        <rect width="38" height="38" rx="8" fill="#38bdf8"/>
        <path d="M 12 19 L 26 19 M 20 13 L 26 19 L 20 25" stroke="#040609" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
