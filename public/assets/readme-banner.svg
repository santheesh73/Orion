<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" role="img" aria-label="Orion - On-Device AI">
  <defs>
    <radialGradient id="bgGradientB" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <radialGradient id="coreGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaBlueB" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaVioletB" cx="70%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbitGradCyanB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="textGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="badgeBorderB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softGlowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="superGlowB" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCoreB {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes rotateClockwiseB {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterB {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes streamFlowB {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .core-pulse-b {
      transform-origin: 600px 215px;
      animation: pulseCoreB 6s ease-in-out infinite;
    }
    .orbit-1-b {
      transform-origin: 600px 215px;
      animation: rotateClockwiseB 45s linear infinite;
    }
    .orbit-2-b {
      transform-origin: 600px 215px;
      animation: rotateCounterB 60s linear infinite;
    }
    .orbit-stream-b {
      animation: streamFlowB 12s linear infinite;
    }
  </style>

  <rect width="1200" height="480" fill="url(#bgGradientB)"/>
  <circle cx="360" cy="200" r="280" fill="url(#nebulaBlueB)"/>
  <circle cx="840" cy="220" r="280" fill="url(#nebulaVioletB)"/>

  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <g stroke="#38bdf8" stroke-width="1" opacity="0.3">
    <path d="M 30,45 L 30,30 L 45,30"/>
    <path d="M 1170,45 L 1170,30 L 1155,30"/>
    <path d="M 30,435 L 30,450 L 45,450"/>
    <path d="M 1170,435 L 1170,450 L 1155,450"/>
  </g>

  <!-- Ambient Radiance -->
  <circle cx="600" cy="215" r="160" fill="url(#coreGlowB)" class="core-pulse-b"/>

  <!-- Orbits -->
  <g class="orbit-1-b">
    <ellipse cx="600" cy="215" rx="260" ry="86" fill="none" stroke="url(#orbitGradCyanB)" stroke-width="1.2" stroke-dasharray="14 10" class="orbit-stream-b" opacity="0.6"/>
    <circle cx="860" cy="215" r="3.5" fill="#38bdf8" filter="url(#softGlowB)"/>
  </g>

  <g class="orbit-2-b">
    <ellipse cx="600" cy="215" rx="200" ry="110" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 8" opacity="0.45"/>
    <circle cx="600" cy="105" r="3" fill="#a78bfa" filter="url(#softGlowB)"/>
  </g>

  <g transform="rotate(-28 600 215)">
    <ellipse cx="600" cy="215" rx="140" ry="46" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75" filter="url(#softGlowB)"/>
    <circle cx="740" cy="215" r="5" fill="#38bdf8" filter="url(#softGlowB)"/>
    <circle cx="740" cy="215" r="2" fill="#ffffff"/>
    <circle cx="460" cy="215" r="5" fill="#818cf8" filter="url(#softGlowB)"/>
    <circle cx="460" cy="215" r="2" fill="#ffffff"/>
  </g>

  <g class="core-pulse-b">
    <ellipse cx="600" cy="215" rx="42" ry="58" fill="none" stroke="#60a5fa" stroke-width="4.5" opacity="0.85" filter="url(#softGlowB)"/>
    <ellipse cx="600" cy="215" rx="24" ry="34" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="600" cy="215" r="9" fill="#ffffff" filter="url(#superGlowB)"/>
    <circle cx="600" cy="215" r="4" fill="#38bdf8"/>
  </g>

  <rect x="475" y="44" width="250" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="url(#badgeBorderB)" stroke-width="1"/>
  <circle cx="493" cy="58" r="3.5" fill="#10b981" filter="url(#softGlowB)"/>
  <text x="506" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.18em">ON-DEVICE AI RUNTIME</text>

  <text x="600" y="380" text-anchor="middle" fill="url(#textGradB)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.45em">ORION</text>
  <text x="600" y="408" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.22em">PRIVATE AI · ZERO CLOUD · BROWSER-NATIVE RUNTIME</text>
</svg>
